<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huliot SO — Official Sales Order Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2744;--navy2:#1a3a6b;--blue:#2563b0;--blue2:#3b82f6;
  --accent:#f59e0b;--accent2:#fbbf24;
  --bg:#f0f4f9;--surface:#ffffff;--surface2:#f8fafc;
  --border:#dde3ee;--border2:#c5d0e0;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --green:#16a34a;--red:#dc2626;--orange:#ea580c;
  --r8:8px;--r12:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;display:flex;flex-direction:column}
input,select,textarea,button{font-family:inherit;font-size:14px}

/* ── TOPBAR ── */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{width:30px;height:30px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--navy)}
.topbar-name{font-weight:600;font-size:15px;letter-spacing:-.2px}
.topbar-sub{font-size:11px;opacity:.6}
.cart-badge{background:var(--accent);color:var(--navy);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;border:none}

/* ── TABS ── */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 20px;position:sticky;top:52px;z-index:90}
.tab{padding:14px 18px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* ── SCREENS ── */
.screen{display:none;padding:20px;max-width:1200px;margin:0 auto;width:100%}
.screen.active{display:block}

/* ── UI COMPONENTS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:var(--r8);padding:8px 10px;outline:none}
.field input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(37,99,176,.1)}
.required{color:var(--red)}

/* ── CATALOG ── */
.catalog-line-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.ltab{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border2);font-size:12px;font-weight:500;cursor:pointer;background:var(--surface);transition:all .18s;}
.ltab.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.product-table{width:100%;border-collapse:collapse}
.product-table th{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text3);padding:10px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface2)}
.product-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.p-code{font-family:'DM Mono',monospace;font-size:11px;color:var(--blue)}
.table-wrap{overflow:auto;border-radius:var(--r12);border:1px solid var(--border);background:var(--surface);max-height:calc(100vh - 350px)}

.add-btn{background:var(--navy2);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}
.add-btn.added{background:var(--green)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--r8);font-weight:600;cursor:pointer;transition:all .15s;font-size:13px;border:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-outline{background:var(--surface);color:var(--text2);border:1px solid var(--border2)}
.btn-accent{background:var(--accent);color:var(--navy)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:var(--r8);opacity:0;transition:all .25s;pointer-events:none;z-index:1000}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">HPF</div>
    <div>
      <div class="topbar-name">Huliot Pipes & Fittings</div>
      <div class="topbar-sub">Sales Order Format — HPF-01</div>
    </div>
  </div>
  <button class="cart-badge" onclick="switchTab('cart')">
    🛒 <span id="cart-count">0 items</span>
  </button>
</div>

<div class="tabs">
  <div class="tab active" id="t-order" onclick="switchTab('order')">📋 Order Details</div>
  <div class="tab" id="t-catalog" onclick="switchTab('catalog')">🛍️ Browse Catalog</div>
  <div class="tab" id="t-cart" onclick="switchTab('cart')">🛒 Cart & Review</div>
</div>

<div class="screen active" id="screen-order">
  <div class="card">
    <div class="card-title">Order Identity & Dates</div>
    <div class="form-grid" style="grid-template-columns: repeat(4, 1fr)">
      <div class="field"><label>SO Number</label><input id="so_no" placeholder="SO-2026-001"></div>
      <div class="field"><label>PO Number</label><input id="customer_po_no" placeholder="PO-123"></div>
      <div class="field"><label>Order Date</label><input id="order_date" type="date"></div>
      <div class="field"><label>PO Date</label><input id="po_date" type="date"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Sales & Project Details</div>
    <div class="form-grid" style="grid-template-columns: repeat(4, 1fr)">
      <div class="field">
        <label>Sales Person <span class="required">*</span></label>
        <select id="sales_person">
          <option value="">— Select —</option>
          <option>Tushar Nag</option><option>Mriganco Maiti</option><option>Sumit Sharma</option>
          <option>Yuvraj Rathod</option><option>Himanshu Todi</option><option>Mohit Gupta</option>
          <option>Huliot South</option><option>Huliot East</option><option>Huliot North</option>
        </select>
      </div>
      <div class="field"><label>RERA Project No <span class="required">*</span></label><input id="rera_no" placeholder="Required for Processing"></div>
      <div class="field"><label>Bitrix Deal ID</label><input id="bitrix_id" placeholder="Deal #"></div>
      <div class="field"><label>Order Validity</label><select id="order_validity"><option>7 Days</option><option>15 Days</option><option>30 Days</option></select></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Address & Billing</div>
    <div class="form-grid" style="grid-template-columns: 1fr 1fr">
      <div class="field"><label>Bill To Name <span class="required">*</span></label><input id="bill_name" placeholder="Company Name"></div>
      <div class="field"><label>Ship To Name</label><input id="ship_name" placeholder="Leave blank if same as Billing"></div>
      <div class="field"><label>Billing Address</label><textarea id="bill_address" rows="2"></textarea></div>
      <div class="field"><label>Shipping Address</label><textarea id="ship_address" rows="2"></textarea></div>
    </div>
    <div class="form-grid" style="grid-template-columns: repeat(4, 1fr); margin-top: 10px;">
      <div class="field"><label>City</label><input id="bill_city"></div>
      <div class="field"><label>PIN Code</label><input id="bill_pin"></div>
      <div class="field"><label>GSTIN</label><input id="bill_gstin"></div>
      <div class="field"><label>Payment Term</label><select id="payment_term"><option>Advance</option><option>30 Days PDC</option><option>LC at Sight</option></select></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Commercials</div>
    <div class="form-grid" style="grid-template-columns: repeat(3, 1fr)">
      <div class="field"><label>Cash Discount %</label><select id="cash_discount" onchange="recalcAll()"><option value="0">0%</option><option value="0.03" selected>3%</option></select></div>
      <div class="field"><label>Freight Terms</label><input id="freight" value="FOR"></div>
      <div class="field"><label>Other Remarks</label><input id="other_remark" placeholder="Special Instructions"></div>
    </div>
  </div>
</div>

<div class="screen" id="screen-catalog">
  <div class="card">
    <div class="catalog-line-tabs" id="line-tabs"></div>
    <div class="search-box">
      <input id="search-input" placeholder="Search Item Code or Description..." oninput="renderProducts()" style="width:100%; padding:12px; border-radius:var(--r8); border:1px solid var(--border2)">
    </div>
  </div>
  <div class="table-wrap">
    <table class="product-table">
      <thead>
        <tr><th>Code</th><th>Description</th><th>DN</th><th>Price</th><th>Disc%</th><th>Net ₹</th><th></th></tr>
      </thead>
      <tbody id="product-body"></tbody>
    </table>
  </div>
</div>

<div class="screen" id="screen-cart">
  <div class="card" style="padding:0; overflow:hidden">
    <table class="product-table" style="width:100%">
      <thead style="background:var(--surface2)">
        <tr><th>#</th><th>Code</th><th>Description</th><th>Qty</th><th>Net Price</th><th>Total Basic</th><th></th></tr>
      </thead>
      <tbody id="cart-body"></tbody>
    </table>
  </div>
  
  <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px">
    <button class="btn btn-outline" onclick="clearCart()">Clear Cart</button>
    <button class="btn btn-primary" onclick="downloadCSV()">Download CSV Data</button>
    <button class="btn btn-accent" onclick="downloadSummaryHTML()">Download Official SO (HTML)</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- FULL PRODUCT DATABASE (1,468 items) ---
const PRODUCTS = [
  {"code": "54040300-i", "desc": "HT PRO PIPE WITH ONE SOCKET L 3000", "dn": "40", "moq": 1, "price": 567.0, "tab": "HT Pro", "hsn": "39171020"},
  {"code": "54050300-i", "desc": "HT PRO PIPE WITH ONE SOCKET L 3000", "dn": "50", "moq": 1, "price": 740.0, "tab": "HT Pro", "hsn": "39171020"},
  {"code": "54075300-i", "desc": "HT PRO PIPE WITH ONE SOCKET L 3000", "dn": "75", "moq": 1, "price": 1304.0, "tab": "HT Pro", "hsn": "39171020"},
  {"code": "540110300-i", "desc": "HT PRO PIPE WITH ONE SOCKET L 3000", "dn": "110", "moq": 1, "price": 1752.0, "tab": "HT Pro", "hsn": "39171020"},
  {"code": "540125300-i", "desc": "HT PRO PIPE WITH ONE SOCKET L 3000", "dn": "125", "moq": 1, "price": 3401.0, "tab": "HT Pro", "hsn": "39171020"},
  {"code": "540160300-i", "desc": "HT PRO PIPE WITH ONE SOCKET L 3000", "dn": "160", "moq": 1, "price": 4117.0, "tab": "HT Pro", "hsn": "39171020"},
  {"code": "540200300-i", "desc": "HT PRO PIPE WITH ONE SOCKET L 3000", "dn": "200", "moq": 1, "price": 8303.0, "tab": "HT Pro", "hsn": "39171020"},
  {"code": "5751100300-i", "desc": "ULTRA SILENT PIPE WITH ONE SOCKET L 3000", "dn": "110", "moq": 1, "price": 2954.0, "tab": "Ultra Silent", "hsn": "39171020"},
  {"code": "P-PERTAL16", "desc": "MULTILAYER PIPE PE-RT/AL/PERT 16x2.0", "dn": "16", "moq": 1, "price": 213.0, "tab": "MLCP / PERT", "hsn": "39173990"},
  {"code": "K234016", "desc": "FEMALE THREADED ADAPTER 16x1/2 - KLIMAPRESS", "dn": "16x1/2", "moq": 40, "price": 508.0, "tab": "MLCP / PERT", "hsn": "74122090"}
  // ... more items would be here. In a production file, paste all 1468 items here.
];

let cart = [];
let activeLineTab = 'HT Pro';

// --- INITIALIZATION ---
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('order_date').value = today;
  document.getElementById('po_date').value = today;
  buildLineTabs();
  renderProducts();
});

function buildLineTabs() {
  const tabs = ['HT Pro','Ultra Silent','MLCP / PERT','PPR / Heliroma','Red Fire / SS','Accessories'];
  document.getElementById('line-tabs').innerHTML = tabs.map(t => 
    `<div class="ltab ${t===activeLineTab?'active':''}" onclick="setTab('${t}')">${t}</div>`
  ).join('');
}

function setTab(t) { activeLineTab = t; buildLineTabs(); renderProducts(); }

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('t-'+t).classList.add('active');
  document.getElementById('screen-'+t).classList.add('active');
  if(t==='cart') renderCart();
}

function renderProducts() {
  const sq = document.getElementById('search-input').value.toLowerCase();
  const cd = parseFloat(document.getElementById('cash_discount').value) || 0;
  const filtered = PRODUCTS.filter(p => p.tab === activeLineTab && (p.code.toLowerCase().includes(sq) || p.desc.toLowerCase().includes(sq)));
  
  document.getElementById('product-body').innerHTML = filtered.map(p => {
    const net = (p.price * 0.48 * (1 - cd)).toFixed(2); // 52% Standard Discount
    return `<tr>
      <td><span class="p-code">${p.code}</span></td>
      <td>${p.desc}</td>
      <td style="text-align:center">${p.dn}</td>
      <td>₹${p.price.toLocaleString()}</td>
      <td>52%</td>
      <td style="font-weight:700">₹${net}</td>
      <td><button class="add-btn" onclick="addToCart('${p.code}')">+ Add</button></td>
    </tr>`;
  }).join('');
}

function addToCart(code) {
  const p = PRODUCTS.find(x => x.code === code);
  const cd = parseFloat(document.getElementById('cash_discount').value) || 0;
  const existing = cart.find(c => c.code === code);
  if(existing) { 
    existing.qty += p.moq; 
  } else { 
    cart.push({...p, qty: p.moq, netPrice: p.price * 0.48 * (1 - cd)});
  }
  updateCartBadge();
  showToast("Added " + code);
}

function renderCart() {
  const body = document.getElementById('cart-body');
  if(!cart.length) { body.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px">Your cart is empty.</td></tr>'; return; }
  
  body.innerHTML = cart.map((i, idx) => `
    <tr>
      <td>${idx+1}</td>
      <td><span class="p-code">${i.code}</span></td>
      <td>${i.desc}</td>
      <td><input type="number" class="field" style="width:70px" value="${i.qty}" onchange="updateQty('${i.code}', this.value)"></td>
      <td>₹${i.netPrice.toFixed(2)}</td>
      <td style="font-weight:700">₹${(i.qty * i.netPrice).toLocaleString()}</td>
      <td><button onclick="removeFromCart('${i.code}')" style="color:var(--red); border:none; background:none; cursor:pointer">Remove</button></td>
    </tr>`).join('');
}

function updateQty(code, val) { const i = cart.find(c=>c.code===code); if(i) i.qty = parseInt(val) || 1; renderCart(); }
function removeFromCart(code) { cart = cart.filter(c=>c.code!==code); renderCart(); updateCartBadge(); }
function clearCart() { if(confirm("Clear all?")) { cart = []; renderCart(); updateCartBadge(); } }
function updateCartBadge() { document.getElementById('cart-count').textContent = cart.length + " items"; }

// --- EXPORT FUNCTIONS ---

function downloadCSV() {
  if (!cart.length) return;
  const soNo = document.getElementById('so_no').value || 'DRAFT';
  let csv = 'Sales Order Data Export\r\nSO Number,${soNo}\r\nSales Person,${document.getElementById("sales_person").value}\r\n\r\n';
  csv += 'Item Code,Description,DN,Qty,Net Price,Basic Total\r\n';
  cart.forEach(i => {
    csv += `"${i.code}","${i.desc}","${i.dn}",${i.qty},${i.netPrice.toFixed(2)},${(i.qty*i.netPrice).toFixed(2)}\r\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `Huliot_Data_${soNo}.csv`; a.click();
}

function downloadSummaryHTML() {
  if (!cart.length) { alert("Cart is empty"); return; }
  const soNo = document.getElementById('so_no').value || 'DRAFT';
  const date = document.getElementById('order_date').value;
  const totalBasic = cart.reduce((s,i) => s + (i.qty * i.netPrice), 0);
  const gst = totalBasic * 0.18;

  const rows = cart.map((i, idx) => `
    <tr>
      <td style="border:1px solid #000; padding:5px; text-align:center">${idx+1}</td>
      <td style="border:1px solid #000; padding:5px">${i.code}</td>
      <td style="border:1px solid #000; padding:5px">${i.desc}</td>
      <td style="border:1px solid #000; padding:5px; text-align:center">${i.dn}</td>
      <td style="border:1px solid #000; padding:5px; text-align:center">${i.qty}</td>
      <td style="border:1px solid #000; padding:5px; text-align:right">₹${i.price.toFixed(2)}</td>
      <td style="border:1px solid #000; padding:5px; text-align:right">₹${i.netPrice.toFixed(2)}</td>
      <td style="border:1px solid #000; padding:5px; text-align:right"><b>₹${(i.qty * i.netPrice).toLocaleString()}</b></td>
    </tr>`).join('');

  const html = `
  <html><head><title>Huliot SO ${soNo}</title></head>
  <body style="font-family: Arial, sans-serif; padding: 30px;">
    <div style="border: 2px solid #0f2744; padding: 20px;">
      <div style="display:flex; justify-content: space-between; border-bottom: 2px solid #0f2744; padding-bottom: 10px;">
        <div style="background:#f59e0b; color:#0f2744; font-weight:bold; padding:15px; font-size:24px;">HPF</div>
        <div style="text-align: center;">
          <h2 style="color:#0f2744; margin:0">HULIOT PIPES AND FITTINGS PVT. LTD.</h2>
          <p style="font-size:11px; margin:0">Vadodara, Gujarat-391770 | format: HPF-01</p>
        </div>
        <div style="text-align: right; font-size: 12px;">
          <b>SO No:</b> ${soNo}<br><b>Date:</b> ${date}
        </div>
      </div>
      <h3 style="text-align:center; background:#0f2744; color:white; padding:8px; margin:15px 0;">SALES ORDER FORM</h3>
      <table style="width:100%; border-collapse:collapse; margin-bottom:15px;">
        <tr>
          <td width="50%" style="border:1px solid #ccc; padding:10px;"><b>Bill To:</b><br>${document.getElementById('bill_name').value}<br>${document.getElementById('bill_address').value}</td>
          <td width="50%" style="border:1px solid #ccc; padding:10px;"><b>Ship To:</b><br>${document.getElementById('ship_name').value || 'Same as Bill'}<br>${document.getElementById('ship_address').value}</td>
        </tr>
      </table>
      <table style="width:100%; border-collapse:collapse; font-size: 12px;">
        <thead style="background:#f0f0f0;">
          <tr><th style="border:1px solid #000; padding:5px">Sr.</th><th style="border:1px solid #000; padding:5px">Code</th><th style="border:1px solid #000; padding:5px">Description</th><th style="border:1px solid #000; padding:5px">DN</th><th style="border:1px solid #000; padding:5px">Qty</th><th style="border:1px solid #000; padding:5px">List ₹</th><th style="border:1px solid #000; padding:5px">Net ₹</th><th style="border:1px solid #000; padding:5px">Total ₹</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="text-align:right; margin-top:20px;">
        <p>Basic Value: ₹${totalBasic.toLocaleString()}</p>
        <p>GST (approx 18%): ₹${gst.toLocaleString()}</p>
        <p style="font-size:18px; color:#0f2744"><b>Grand Total: ₹${(totalBasic+gst).toLocaleString()}</b></p>
      </div>
    </div>
  </body></html>`;

  const blob = new Blob([html], {type: 'text/html'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `Huliot_SO_${soNo}.html`; a.click();
}

function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
</script>
</body>
</html>
